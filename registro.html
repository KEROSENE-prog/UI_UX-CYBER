<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - POS Gaming</title>
<link rel="stylesheet" href="styles.css">
<style>
main.auth-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background-image: linear-gradient(rgba(10, 10, 10, 0.85), rgba(53, 192, 41, 0.4)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070');
  background-size: cover;
  background-position: center;
}
article.auth-card {
  background-color: var(--bg-card);
  padding: 40px;
  border-radius: 12px;
  width: 100%;
  max-width: 450px;
  border-top: 4px solid var(--brand-primary);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
header.auth-header {
  text-align: center;
  margin-bottom: 32px;
}
header.auth-header h1 {
  color: var(--brand-primary);
  margin-bottom: 8px;
}
form.auth-form fieldset {
  border: none;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
p.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
p.form-group label {
  font-weight: 600;
  color: var(--text-muted);
}
p.form-options {
  font-size: 0.9rem;
  margin-top: 8px;
}
footer.auth-footer {
  margin-top: 24px;
  text-align: center;
  font-size: 0.9rem;
}
footer.auth-footer a {
  color: var(--brand-primary);
  font-weight: 600;
  text-decoration: none;
}
.role-tabs {
  display: flex;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-color);
}
.role-tabs button {
  flex: 1;
  background: transparent;
  color: var(--text-muted);
  border-radius: 0;
  padding: 12px;
}
.role-tabs button.active {
  color: var(--brand-primary);
  border-bottom: 2px solid var(--brand-primary);
}
</style>
</head>
<body>
<main class="auth-page">
<article class="auth-card">
<header class="auth-header">
<h1>Registro de Cuenta</h1>
<p>Crea tu cuenta pública o de administrador</p>
</header>
<nav class="role-tabs">
<button class="active" type="button">Cliente</button>
<button type="button">Administrador</button>
</nav>
<form class="auth-form" action="login.html">
<fieldset>
<p class="form-group">
<label for="fullname">Nombre Completo</label>
<input type="text" id="fullname" required placeholder="Ej. Juan Pérez">
</p>
<p class="form-group">
<label for="email">Correo Electrónico</label>
<input type="email" id="email" required placeholder="correo@ejemplo.com">
</p>
<p class="form-group">
<label for="password">Contraseña</label>
<input type="password" id="password" required placeholder="••••••••">
</p>
<p class="form-group">
<label for="confirm">Confirmar Contraseña</label>
<input type="password" id="confirm" required placeholder="••••••••">
</p>
<p class="form-options">
<label><input type="checkbox" required> Acepto los términos y condiciones</label>
</p>
<button type="submit" class="primary" style="width:100%; padding: 14px; margin-top: 10px;">Crear Cuenta</button>
</fieldset>
</form>
<footer class="auth-footer">
<p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
</footer>
</article>
</main>
<script>
const tabs = document.querySelectorAll('.role-tabs button');
tabs.forEach(tab => {
tab.addEventListener('click', (e) => {
tabs.forEach(t => t.classList.remove('active'));
e.target.classList.add('active');
});
});
</script>
</body>
</html>
